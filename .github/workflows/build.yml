name: Build Ashraful AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip Ashraful_AI_Autopilot_Android_Starter.zip

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("AshrafulAIAutopilot/app/build.gradle.kts")
          s = p.read_text()

          old = '    buildFeatures { compose = true }'

          new = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          buildFeatures { compose = true }'''

          if old not in s:
              raise SystemExit("Gradle configuration not found")

          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build APK
        run: |
          gradle -p AshrafulAIAutopilot assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashraful-AI-Autopilot-APK
          path: AshrafulAIAutopilot/app/build/outputs/apk/debug/app-debug.apk
